<!doctype html><html lang="sl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Test GURS – napetosti</title><link rel="stylesheet" href="https://tony-ops1.github.io/Elektro-Okvare/leaflet.css"><style>body{font:16px system-ui;margin:12px;background:#f3f6fa;color:#162536}#map{height:55vh;min-height:300px;background:#ddd}button{padding:12px;background:#17466d;color:white;border:0;border-radius:8px;font:inherit}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:white;padding:12px}p{line-height:1.5}</style><h1>Test napetosti GURS</h1><p>Premakni karto na želeno območje in pritisni gumb. En javni WFS zahtevek za približno 2 km široko območje okoli središča. Brez samodejnega osveževanja.</p><div id="map"></div><p><b style="color:#dc2626">VN</b> · <b style="color:#2563eb">SN</b> · <b style="color:#16803c">NN</b> · <b style="color:#777">Neznano</b> (poskusna razvrstitev ATR2)</p><button id="load">Preveri vode na sredini karte</button> <a href="https://ipi.eprostor.gov.si/jgp/" target="_blank" rel="noopener">Javni izvoz GURS</a><pre id="result">Čakam na ročni test.</pre><script src="https://tony-ops1.github.io/Elektro-Okvare/leaflet.js"></script><script src="https://tony-ops1.github.io/Elektro-Okvare/proj4.js"></script><script>
const out=document.getElementById('result'),btn=document.getElementById('load');
const map=L.map('map').setView([46.0569,14.5058],15);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap contributors',maxZoom:19}).addTo(map);
proj4.defs('EPSG:3794','+proj=tmerc +lat_0=0 +lon_0=15 +k=0.9999 +x_0=500000 +y_0=-5000000 +ellps=GRS80 +units=m +no_defs');
let imported=new Map();
document.getElementById('load').insertAdjacentHTML('afterend','<p>Uvozi javni GURS GeoJSON z atributoma EID_LINIJA in ATR2 (ali GJI_ATR2_SIFRA): <input id="import" type="file" accept=".json,.geojson"></p><p id="importStatus">Dodatni podatki niso uvoženi.</p>');
document.getElementById('import').onchange=async function(){try{const d=JSON.parse(await this.files[0].text());if(!Array.isArray(d.features))throw Error('Pričakujem GeoJSON FeatureCollection');const next=new Map(), conflicts=new Set();for(const f of d.features){const p=f.properties||{}, id=Object.keys(p).find(k=>k.toUpperCase()==='EID_LINIJA'),v=attr(p);if(id&&typeof p[id]==='string'&&v!=null&&codes[String(v)]){const key=p[id], val=String(v);if(next.has(key)&&next.get(key)!==val)conflicts.add(key);next.set(key,val)}}for(const k of conflicts)next.delete(k);imported=next;document.getElementById('importStatus').textContent='Uvoženih enoličnih identifikatorjev z napetostjo: '+next.size+'; konfliktov: '+conflicts.size+'. Ponovi preverjanje vodov.'}catch(e){document.getElementById('importStatus').textContent='Uvoz ni uspel: '+e.message}};
const codes={'1':'VN','2':'VN','3':'VN','4':'SN','5':'SN','6':'SN','7':'SN','10':'SN','8':'NN','9':'SN'};
const colors={VN:'#dc2626',SN:'#2563eb',NN:'#16803c',unknown:'#777777'};
function attr(p){const k=Object.keys(p||{}).find(k=>['ATR2','GJI_ATR2_SIFRA'].includes(k.toUpperCase()));return k===undefined?null:p[k]}
function group(p){const id=p&&p.EID_LINIJA;return codes[String(attr(p))]||codes[imported.get(id)]||'unknown'}
let layer;
btn.onclick=async()=>{btn.disabled=true;out.textContent='Nalagam javne podatke GURS ...';const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),25000);try{
const c=map.getCenter(),sw=proj4('EPSG:4326','EPSG:3794',[c.lng-.01,c.lat-.01]),ne=proj4('EPSG:4326','EPSG:3794',[c.lng+.01,c.lat+.01]);
const q='SERVICE=WFS&VERSION=2.0.0&REQUEST=GetFeature&TYPENAMES='+encodeURIComponent('SI.GURS.KGI:LINIJE_ELEKTRICNA_ENERGIJA_G')+'&OUTPUTFORMAT='+encodeURIComponent('application/json')+'&SRSNAME=EPSG%3A4326&BBOX='+encodeURIComponent([...sw,...ne,'EPSG:3794'].join(','));
const r=await fetch('https://ipi.eprostor.gov.si/wfs-si-gurs-kgi/wfs?'+q,{signal:controller.signal});if(!r.ok)throw Error('HTTP '+r.status+' — '+(await r.text()).slice(0,1500));const d=await r.json();if(d.type!=='FeatureCollection'||!Array.isArray(d.features))throw Error('Ni veljaven GeoJSON');
const counts={VN:0,SN:0,NN:0,unknown:0},raw={},keys=new Set();let present=0;
for(const f of d.features){const p=f.properties||{};Object.keys(p).forEach(k=>keys.add(k));const v=attr(p);if(v!==null&&v!==undefined&&v!=='')present++;const k=String(v);raw[k]=(raw[k]||0)+1;counts[group(p)]++}
if(layer)map.removeLayer(layer);layer=L.geoJSON(d,{style:f=>({color:colors[group(f.properties)],weight:3}),onEachFeature:(f,l)=>{const n=document.createElement('pre');n.textContent=JSON.stringify(f.properties,null,2);l.bindPopup(n)}}).addTo(map);
out.textContent=JSON.stringify({vrnjeni_vodi:d.features.length,numberMatched:d.numberMatched??null,ATR2_izpolnjen:present,uvozenih_identifikatorjev:imported.size,poskusna_razvrstitev:counts,surove_vrednosti_ATR2:raw,atributi:[...keys],opomba:'Šifrant je treba potrditi pred uporabo v glavni aplikaciji.'},null,2);
}catch(e){out.textContent='Test ni uspel: '+e.message+'. To ne pomeni, da podatkov ni.'}finally{clearTimeout(timer);btn.disabled=false}};

const inspire='https://ipi.eprostor.gov.si/wfs-si-gurs-ins/us-net-el/wfs';
const ib=document.createElement('button');ib.textContent='Preveri alternativni INSPIRE servis';btn.after(ib);
ib.onclick=async()=>{ib.disabled=true;out.textContent='Preverjam INSPIRE ...';const ctl=new AbortController(),timer=setTimeout(()=>ctl.abort(),25000);
try{const r=await fetch(inspire+'?service=WFS&request=GetCapabilities',{signal:ctl.signal});if(!r.ok)throw Error('HTTP '+r.status);const xml=new DOMParser().parseFromString(await r.text(),'application/xml');const types=Array.from(xml.getElementsByTagNameNS('*','FeatureType')).map(n=>({name:n.getElementsByTagNameNS('*','Name')[0]?.textContent,title:n.getElementsByTagNameNS('*','Title')[0]?.textContent})).filter(x=>x.name);if(!types.length)throw Error('Ni seznama slojev');out.textContent=JSON.stringify({vir:inspire,sloji:types},null,2);const candidate=types.find(x=>/ElectricityCable/i.test(x.name));if(candidate){const q='?SERVICE=WFS&VERSION=2.0.0&REQUEST=DescribeFeatureType&TYPENAMES='+encodeURIComponent(candidate.name);const rr=await fetch(inspire+q,{signal:ctl.signal});out.textContent+='\n\nShema '+candidate.name+' (HTTP '+rr.status+'):\n'+(await rr.text()).slice(0,18000)}}catch(e){out.textContent+='\nNapaka: '+e.message}finally{clearTimeout(timer);ib.disabled=false}};
</script></html>
